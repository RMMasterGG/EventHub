version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: EventHubDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123123
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data: